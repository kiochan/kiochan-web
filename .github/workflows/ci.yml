name: CI

on:
  push:
    branches-ignore:
      - prod
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable the pinned package manager
        run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: pnpm lint
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Check translations
        run: node --test scripts/localization.test.mjs
      - name: Check Lab engines
        run: node --test scripts/lab-engines.test.mjs
      - name: Check runtime release boundaries
        run: node --test scripts/releases.test.mjs
      - name: Build the website
        run: pnpm build
      - name: Build the production container
        run: docker build -t kiochan-web:ci .
      - name: Build the migration container
        run: docker build --target migrator -t kiochan-web:migrate-ci .
      - name: Start the isolated integration database
        env:
          KIOCHAN_POSTGRES_ADMIN_PASSWORD: ci-admin-password
          KIOCHAN_WEB_DATABASE_PASSWORD: ci-web-password
        run: docker compose -f infrastructure/postgres/compose.yaml up -d --wait
      - name: Verify the website role is restricted
        run: |
          result=$(docker exec -e PGPASSWORD=ci-web-password kiochan-postgres psql -h 127.0.0.1 -U kiochan_web -d kiochan_web -Atc "SELECT NOT (rolsuper OR rolcreatedb OR rolcreaterole) FROM pg_roles WHERE rolname = current_user")
          test "$result" = "t"
      - name: Apply checked-in Prisma migrations
        run: >-
          docker run --rm --network kiochan-data
          -e DATABASE_URL=postgresql://kiochan_web:ci-web-password@kiochan-postgres:5432/kiochan_web
          kiochan-web:migrate-ci
      - name: Verify the migration was recorded
        run: |
          result=$(docker exec -e PGPASSWORD=ci-web-password kiochan-postgres psql -h 127.0.0.1 -U kiochan_web -d kiochan_web -Atc 'SELECT COUNT(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')
          test "$result" -ge 1
      - name: Prepare the isolated public release mount
        run: mkdir -p "$RUNNER_TEMP/kiochan-releases"
      - name: Start the production website
        run: >-
          docker run -d --name kiochan-web-ci --network kiochan-data
          -p 127.0.0.1:3000:3000
          --mount type=bind,src=${{ runner.temp }}/kiochan-releases,dst=/releases,readonly
          -e DATABASE_URL=postgresql://kiochan_web:ci-web-password@kiochan-postgres:5432/kiochan_web
          kiochan-web:ci
      - name: Check the page and database connection
        env:
          EXPECT_DATABASE: connected
        run: node scripts/smoke-test.mjs
      - name: Verify Markdown and downloads update without rebuilding
        env:
          RELEASES_ROOT: ${{ runner.temp }}/kiochan-releases
        run: node scripts/releases-smoke.mjs
      - name: Show failed integration logs
        if: failure()
        run: |
          docker logs kiochan-web-ci 2>/dev/null || true
          docker logs kiochan-postgres 2>/dev/null || true
      - name: Stop integration containers
        if: always()
        env:
          KIOCHAN_POSTGRES_ADMIN_PASSWORD: ci-admin-password
          KIOCHAN_WEB_DATABASE_PASSWORD: ci-web-password
        run: |
          docker rm -f kiochan-web-ci 2>/dev/null || true
          docker compose -f infrastructure/postgres/compose.yaml down
