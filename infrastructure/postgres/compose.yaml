name: kiochan-postgres

services:
  postgres:
    image: postgres:18-bookworm
    container_name: kiochan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiochan_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${KIOCHAN_POSTGRES_ADMIN_PASSWORD:?Set the admin password}
      KIOCHAN_WEB_DATABASE_PASSWORD: ${KIOCHAN_WEB_DATABASE_PASSWORD:?Set the web password}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - data:/var/lib/postgresql
      - ./init/10-web-database.sh:/docker-entrypoint-initdb.d/10-web-database.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiochan_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
    name: kiochan-postgres-data

networks:
  data:
    name: kiochan-data
