name: kiochan-web

services:
  web:
    image: ${KIOCHAN_WEB_IMAGE:-kiochan-web:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: kiochan-web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the website database URL}
    ports:
      - "127.0.0.1:4095:3000"
    networks:
      - default
      - data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  data:
    external: true
    name: kiochan-data
