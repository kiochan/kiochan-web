map $http_x_forwarded_proto $kiochan_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kiochan.one;

    ssl_certificate /etc/letsencrypt/live/kiochan.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiochan.one/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($kiochan_forwarded_proto = http) {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:4095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $kiochan_forwarded_proto;
    }
}
